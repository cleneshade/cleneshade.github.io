<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleneshade | Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Ensuring Markdown headers are Bold */
        #content h1 { 
            display: block; font-size: 2.25rem; font-weight: 800 !important; 
            margin: 2rem 0 1rem; color: #111827;
        }
        #content h2 { 
            display: block; font-size: 1.5rem; font-weight: 700 !important; 
            margin: 1.5rem 0 0.75rem; border-bottom: 2px solid #e5e7eb;
            padding-bottom: 0.5rem; color: #1f2937;
        }
        #content p { margin-bottom: 1rem; line-height: 1.6; color: #374151; }
        
        .hidden-section { display: none; }
        html { scroll-behavior: smooth; }

        /* Custom Button Color #99D9EA */
        .btn-custom {
            background-color: #99D9EA !important;
            color: #1f2937 !important;
            transition: all 0.2s ease;
        }
        .btn-custom:hover {
            filter: brightness(0.9);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center cursor-pointer" onclick="showDocs()">
                <img src="https://private-user-images.githubusercontent.com/250621067/573160750-78400696-7373-4fc7-9894-a9c41b5cbf5c.png?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbSIsImtleSI6ImtleTUiLCJleHAiOjE3NzUxNDU2MzYsIm5iZiI6MTc3NTE0NTMzNiwicGF0aCI6Ii8yNTA2MjEwNjcvNTczMTYwNzUwLTc4NDAwNjk2LTczNzMtNGZjNy05ODk0LWE5YzQxYjVjYmY1Yy5wbmc_WC1BbXotQWxnb3JpdGhtPUFXUzQtSE1BQy1TSEEyNTYmWC1BbXotQ3JlZGVudGlhbD1BS0lBVkNPRFlMU0E1M1BRSzRaQSUyRjIwMjYwNDAyJTJGdXMtZWFzdC0xJTJGczMlMkZhd3M0X3JlcXVlc3QmWC1BbXotRGF0ZT0yMDI2MDQwMlQxNTU1MzZaJlgtQW16LUV4cGlyZXM9MzAwJlgtQW16LVNpZ25hdHVyZT1kOGQzYmE2MjBkYmIxYTE2ODU2M2JkMDgyYjk4ZTA5MGFiMDlmOTdjMGNlMjZmZDJjY2YxNmI3ZDRiY2NlZTYyJlgtQW16LVNpZ25lZEhlYWRlcnM9aG9zdCJ9.OlMK8ppUXc3UvHE3WKfIkzYvWk_quZHJCHSrTiew1T8" 
                     alt="Logo" class="h-10 w-auto">
            </div>
            
            <div class="flex items-center space-x-6">
                <nav id="nav-menu" class="hidden lg:flex space-x-6 font-bold text-gray-700">
                    </nav>

                <button onclick="showDownloadArea()" class="btn-custom px-5 py-2 rounded-lg font-bold text-sm shadow-sm">
                    Get Download
                </button>
                
                <a href="https://github.com/cleneshade/cleneshade" target="_blank" class="text-gray-800 hover:text-black">
                    <svg height="24" viewBox="0 0 16 16" width="24" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <div id="download-area" class="hidden-section text-center py-20 bg-white rounded-xl shadow-lg border-2 border-dashed border-blue-100">
            <h3 class="text-3xl font-black text-gray-800 mb-4">Download cleneshade</h3>
            <p class="text-gray-500 mb-8 max-w-md mx-auto">Cross-platform bundle for all major desktop operating systems.</p>
            
            <a href="https://github.com/cleneshade/cleneshade/releases/download/0.9.0/cleneshade-cross-platform.zip" 
               class="btn-custom inline-block px-10 py-5 rounded-full font-black text-2xl shadow-xl">
                🪟🍎🐧
            </a>
            
            <div class="mt-10">
                <button onclick="showDocs()" class="text-gray-400 hover:text-blue-500 font-bold transition-colors text-sm uppercase tracking-widest">
                    Restore Documentation
                </button>
            </div>
        </div>

        <article id="content" class="bg-white p-8 md:p-12 rounded-xl shadow-lg"></article>
    </main>

    <script>
        const readmeUrl = 'https://raw.githubusercontent.com/cleneshade/cleneshade/refs/heads/main/README.md';

        function showDownloadArea() {
            document.getElementById('content').classList.add('hidden-section');
            document.getElementById('download-area').classList.remove('hidden-section');
            window.scrollTo(0, 0);
        }

        function showDocs() {
            document.getElementById('content').classList.remove('hidden-section');
            document.getElementById('download-area').classList.add('hidden-section');
        }

        async function fetchAndRender() {
            try {
                const response = await fetch(readmeUrl);
                const markdown = await response.text();
                document.getElementById('content').innerHTML = marked.parse(markdown);

                const lines = markdown.split('\n');
                const navMenu = document.getElementById('nav-menu');
                navMenu.innerHTML = ''; 

                lines.forEach(line => {
                    const headerMatch = line.match(/^(#{1,2})\s+(.*)/);
                    if (headerMatch) {
                        const title = headerMatch[2].replace(/[*_~`]/g, '').trim();
                        const id = title.toLowerCase().replace(/[^\w]+/g, '-');
                        
                        const renderedHeaders = document.querySelectorAll('#content h1, #content h2');
                        renderedHeaders.forEach(h => { if(h.innerText.trim() === title) h.id = id; });

                        const link = document.createElement('a');
                        link.href = `#${id}`;
                        link.textContent = title;
                        link.className = "hover:text-blue-400 transition-colors cursor-pointer uppercase text-xs tracking-tighter";
                        link.onclick = showDocs;
                        navMenu.appendChild(link);
                    }
                });
            } catch (err) { console.error(err); }
        }
        fetchAndRender();
    </script>
</body>
</html>
